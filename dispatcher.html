<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatcher — MEDIKA EKSPRES</title><link rel="stylesheet" href="styles.css"><style>.op-card{padding:16px;margin:12px 0;border:1px solid #e5e7eb;border-radius:14px}.op-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.op-grid label{display:flex;flex-direction:column;gap:5px}.op-grid input,.op-grid select{padding:10px;border:1px solid #d1d5db;border-radius:9px}.money{font-size:1.15rem;font-weight:800}.muted{color:#6b7280;font-size:.9rem}.action{padding:10px 14px;border:0;border-radius:9px;background:#0E8BFF;color:white;font-weight:700;cursor:pointer}.quote{background:#fff7ed;border-color:#fed7aa}.voucher{background:#eff6ff}</style></head><body><header class="topbar"><a class="brand" href="index.html"><img src="assets/logo.png" alt="MEDIKA EKSPRES"></a><b>Dispatcher Pilot</b></header><main class="form-page"><section class="form-card"><div class="form-title-row"><div><h2>READY to Dispatch</h2><p>Kelola tarif >10 km, voucher dispatcher, dan kandidat multiple delivery.</p></div></div><button id="refresh" class="submit-btn" type="button">Muat Order READY</button><div id="groups" style="margin-top:18px"></div></section></main><script src="config.js?v=3-alpha-r4"></script><script>
const C=window.MEDIKA_CONFIG,$=x=>document.getElementById(x);function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));}
function jsonp(p){return new Promise((res,rej)=>{if(!C.SHEETS_ENDPOINT)return rej(Error('Isi SHEETS_ENDPOINT di config.js'));const cb='medikaCallback_'+Math.random().toString(36).slice(2,14),s=document.createElement('script');window[cb]=d=>{delete window[cb];s.remove();res(d)};s.onerror=()=>rej(Error('API gagal'));s.src=C.SHEETS_ENDPOINT+'?'+new URLSearchParams({...p,callback:cb,ts:Date.now()});document.head.appendChild(s);});}
async function post(payload){const r=await fetch(C.SHEETS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});try{return await r.json()}catch(_){return {ok:true}}}
let vouchers=[];async function loadVouchers(){try{const r=await jsonp({action:'vouchers'});vouchers=r.vouchers||[]}catch(_){vouchers=[]}}
function voucherOptions(selected){return '<option value="">Tanpa voucher</option>'+vouchers.map(v=>`<option value="${v.code}" ${v.code===selected?'selected':''}>${v.code} — ${v.type==='PERCENT'?v.value+'%':rupiah(v.value)}</option>`).join('')}
async function saveQuote(id){const provider=document.querySelector(`[data-provider="${id}"]`).value, cost=Number(document.querySelector(`[data-cost="${id}"]`).value||0);if(cost<=0)return alert('Masukkan ongkir kurir aktual.');await post({action:'dispatcherUpdate',orderId:id,courierProvider:provider,providerFare:cost});await load();}
async function applyVoucher(id){const code=document.querySelector(`[data-voucher="${id}"]`).value;await post({action:'dispatcherUpdate',orderId:id,voucherCode:code});await load();}
async function load(){const box=$('groups');box.innerHTML='Memuat…';try{await loadVouchers();const r=await jsonp({action:'readyOrders'});box.innerHTML='';const groups=r.groups||{};if(!Object.keys(groups).length){box.innerHTML='<p>Belum ada order berstatus READY.</p>';return;}Object.entries(groups).forEach(([zone,orders])=>{const d=document.createElement('div');d.className='fare-box';d.style.marginBottom='14px';d.innerHTML=`<h3>${zone} <small>(${orders.length} order)</small></h3>`+orders.map(o=>{const quote=o.manualQuote&& !o.providerFare?`<div class="op-card quote"><b>Tarif >10 km — masukkan quotation kurir</b><div class="op-grid"><label>Provider<select data-provider="${o.orderId}"><option>Lalamove</option><option>GoSend</option><option>GrabExpress</option><option>Lainnya</option></select></label><label>Ongkir aktual<input data-cost="${o.orderId}" type="number" min="1" placeholder="Contoh 37500"></label></div><button class="action" onclick="saveQuote('${o.orderId}')">Hitung & Simpan Tarif</button><p class="muted">Tarif pasien = ongkir aktual + Rp10.000, dibulatkan naik ke Rp1.000.</p></div>`:'';const voucher=`<div class="op-card voucher"><b>Voucher Dispatcher</b><div class="op-grid"><label>Pilih voucher<select data-voucher="${o.orderId}">${voucherOptions(o.voucherCode||'')}</select></label><div><span class="muted">Tarif awal</span><div>${o.baseFare?rupiah(o.baseFare):'Menunggu quotation'}</div></div><div><span class="muted">Diskon</span><div>-${rupiah(o.discountAmount||0)}</div></div><div><span class="muted">Total pasien</span><div class="money">${o.finalFare?rupiah(o.finalFare):'Menunggu quotation'}</div></div></div><button class="action" onclick="applyVoucher('${o.orderId}')" ${!o.baseFare?'disabled':''}>Terapkan Voucher</button></div>`;return `<div style="padding:12px 0;border-top:1px solid #e5e7eb"><b>${o.orderId}</b> · ${o.name}<br><small>${o.address} · ${o.distanceKm} km</small>${quote}${voucher}</div>`}).join('')+(orders.length>1?'<p><b>✓ Kandidat multiple delivery</b> — dispatcher tetap memverifikasi rute sebelum digabung.</p>':'');box.appendChild(d);});}catch(e){box.innerHTML='<p>'+e.message+'</p>';}}
$('refresh').onclick=load;load();
</script></body></html>
